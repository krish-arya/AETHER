# Continuous integration: lint, tests (SQLite + PostgreSQL), dashboard build.
#
# NOTE: written during bootstrap and not yet exercised on GitHub (the repository has
# no remote). Treat the first run as its verification.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Unit and integration tests (SQLite)
        run: uv run pytest
      - name: PostgreSQL integration tests
        env:
          AETHER_TEST_POSTGRES_URL: postgresql+asyncpg://aether:aether@localhost:5432/aether
        run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
